type: canvas
display_name: Seismicity
defaults:
  time_range: P7D
rows:
  - height: 460px
    items:
      - width: 8
        custom_chart:
          title: Gutenberg-Richter curves (earthquakes at or above each magnitude, log scale)
          metrics_sql: |
            SELECT region, mag_bin, n_cum
            FROM magnitude_frequency_metrics
            WHERE region IN ('ALL', 'CA', 'Alaska', 'Japan')
            ORDER BY mag_bin
          vega_spec: |-
            {
              "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
              "width": "container",
              "height": "container",
              "autosize": {"type": "fit", "contains": "padding"},
              "data": {"name": "query1"},
              "mark": {"type": "line", "point": {"size": 12}},
              "encoding": {
                "x": {"field": "mag_bin", "type": "quantitative", "title": "Magnitude"},
                "y": {"field": "n_cum", "type": "quantitative", "title": "Earthquakes at or above (log)", "scale": {"type": "log"}},
                "color": {"field": "region", "type": "nominal", "title": "Region"},
                "tooltip": [
                  {"field": "region", "type": "nominal"},
                  {"field": "mag_bin", "type": "quantitative", "title": "Magnitude"},
                  {"field": "n_cum", "type": "quantitative", "title": "At or above"}
                ]
              }
            }
      - width: 4
        table:
          metrics_view: seismicity_metrics
          title: Detection threshold and b-value per region
          columns: [region, events, mc, b_value]
          sort_by: events
  - items:
      - width: 12
        kpi_grid:
          metrics_view: revisions_metrics
          measures: [live_events, share_revised, median_minutes_to_first_seen, avg_abs_mag_change, type_changes]
  - items:
      - width: 12
        table:
          metrics_view: revisions_metrics
          title: Most revised live events
          columns: [id, region, max_versions, avg_abs_mag_change]
          sort_by: max_versions
