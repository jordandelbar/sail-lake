# One row per event: Iceberg table lake.quakes.events (Dagster asset `quakes_events`), via the Lakekeeper catalog.
type: model
connector: duckdb
create_secrets_from_connectors: s3
# Copy into DuckDB at refresh: dashboards query the local table, the lake is only read here
materialize: true
# Dagster commits new snapshots at :05 :20 :35 :50, pick them up 10 min later
# ponytail: fixed offset, have Dagster trigger the refresh if runs get long
refresh:
  cron: "*/15 * * * *"
# ACCESS_DELEGATION_MODE none: read S3 with our own secret (versitygw has no STS for vended credentials)
pre_exec: >
  INSTALL iceberg; LOAD iceberg;
  ATTACH IF NOT EXISTS 'lake' AS lake (TYPE iceberg, ENDPOINT 'http://lakekeeper:8181/catalog',
  AUTHORIZATION_TYPE 'none', ACCESS_DELEGATION_MODE 'none')
sql: |
  SELECT
    *,
    ST_AsGeoJSON(ST_Point(lon, lat))::VARCHAR AS location,
    CASE
      WHEN mag IS NULL THEN 'unknown'
      WHEN mag < 2 THEN '0 to 2'
      WHEN mag < 3 THEN '2 to 3'
      WHEN mag < 4 THEN '3 to 4'
      WHEN mag < 5 THEN '4 to 5'
      ELSE '5+'
    END AS mag_band
  FROM lake.quakes.events
