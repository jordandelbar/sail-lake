apiVersion: apps/v1
kind: Deployment
metadata:
  name: viz
  namespace: viz
spec:
  selector:
    matchLabels:
      app: viz
  template:
    metadata:
      labels:
        app: viz
    spec:
      nodeSelector:
        tier: medium
      containers:
        - name: rill
          image: viz:dev
          envFrom:
            - secretRef:
                name: s3-creds
          args:
            - start
            - /project
            - --no-open
            - --preview
            - --pull-env=false
            - --environment=prod
            - --port=9009
            - --env=AWS_ACCESS_KEY_ID=$(AWS_ACCESS_KEY_ID)
            - --env=AWS_SECRET_ACCESS_KEY=$(AWS_SECRET_ACCESS_KEY)
            - --env=AWS_ENDPOINT_URL=$(AWS_ENDPOINT_URL)
            - --env=AWS_REGION=$(AWS_REGION)
          ports:
            - containerPort: 9009
          readinessProbe:
            httpGet:
              path: /
              port: 9009
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: viz
  namespace: viz
spec:
  type: LoadBalancer
  selector:
    app: viz
  ports:
    - port: 80
      targetPort: 9009
