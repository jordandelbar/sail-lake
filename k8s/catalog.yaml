apiVersion: v1
kind: Secret
metadata:
  name: lakekeeper
  namespace: catalog
stringData:
  POSTGRES_PASSWORD: lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@lakekeeper-postgres:5432/lakekeeper
  LAKEKEEPER__PG_ENCRYPTION_KEY: sail-lake-dev-encryption-key-change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakekeeper-postgres
  namespace: catalog
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lakekeeper-postgres
  template:
    metadata:
      labels:
        app: lakekeeper-postgres
    spec:
      nodeSelector:
        tier: small
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: lakekeeper
            - name: POSTGRES_DB
              value: lakekeeper
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lakekeeper
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - lakekeeper
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          hostPath:
            path: /data/catalog/postgres
            type: Directory
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: lakekeeper-postgres
  namespace: catalog
spec:
  selector:
    app: lakekeeper-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakekeeper
  namespace: catalog
spec:
  selector:
    matchLabels:
      app: lakekeeper
  template:
    metadata:
      labels:
        app: lakekeeper
    spec:
      nodeSelector:
        tier: small
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      initContainers:
        - name: migrate
          image: quay.io/lakekeeper/catalog:v0.15.1
          args:
            - migrate
          envFrom:
            - secretRef:
                name: lakekeeper
      containers:
        - name: lakekeeper
          image: quay.io/lakekeeper/catalog:v0.15.1
          args:
            - serve
          envFrom:
            - secretRef:
                name: lakekeeper
          ports:
            - containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lakekeeper
  namespace: catalog
spec:
  type: LoadBalancer
  selector:
    app: lakekeeper
  ports:
    - port: 80
      targetPort: 8181
      name: lb
    - port: 8181
      targetPort: 8181
      name: api
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lakekeeper-init
  namespace: catalog
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        tier: small
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: init
          image: curlimages/curl:8.17.0
          envFrom:
            - secretRef:
                name: s3-creds
          command:
            - sh
            - -ec
            - |
              api=http://lakekeeper:8181/management/v1
              until curl -sf http://lakekeeper:8181/health >/dev/null; do sleep 2; done
              curl -s $api/info | grep -q '"bootstrapped":true' ||
                curl -s --fail-with-body -X POST $api/bootstrap -H 'Content-Type: application/json' -d '{"accept-terms-of-use": true}'
              curl -s $api/warehouse | grep -q '"name":"lake"' && exit 0
              curl -s --fail-with-body -X POST $api/warehouse -H 'Content-Type: application/json' -d "{
                \"warehouse-name\": \"lake\",
                \"storage-profile\": {
                  \"type\": \"s3\", \"flavor\": \"s3-compat\", \"bucket\": \"lake\", \"key-prefix\": \"warehouse\",
                  \"region\": \"$AWS_REGION\", \"endpoint\": \"$AWS_ENDPOINT_URL\", \"path-style-access\": true,
                  \"sts-enabled\": false
                },
                \"storage-credential\": {
                  \"type\": \"s3\", \"credential-type\": \"access-key\",
                  \"aws-access-key-id\": \"$AWS_ACCESS_KEY_ID\", \"aws-secret-access-key\": \"$AWS_SECRET_ACCESS_KEY\"
                },
                \"delete-profile\": {\"type\": \"hard\"}
              }"
