apiVersion: v1
kind: ServiceAccount
metadata:
  name: sail
  namespace: compute
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sail
  namespace: compute
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sail
  namespace: compute
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sail
subjects:
  - kind: ServiceAccount
    name: sail
    namespace: compute
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sail
  namespace: compute
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sail
  template:
    metadata:
      labels:
        app: sail
    spec:
      serviceAccountName: sail
      nodeSelector:
        tier: medium
      containers:
        - name: server
          image: sail:0.7.3
          args:
            - spark
            - server
            - --ip
            - "0.0.0.0"
            - --port
            - "50051"
          ports:
            - containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: 50051
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: s3-creds
          env:
            - name: RUST_LOG
              value: info
            - name: SAIL_MODE
              value: kubernetes-cluster
            - name: SAIL_CLUSTER__DRIVER_LISTEN_HOST
              value: 0.0.0.0
            - name: SAIL_CLUSTER__DRIVER_EXTERNAL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SAIL_CLUSTER__WORKER_INITIAL_COUNT
              value: "1"
            - name: SAIL_CLUSTER__WORKER_MAX_COUNT
              value: "2"
            - name: SAIL_CLUSTER__WORKER_TASK_SLOTS
              value: "4"
            - name: SAIL_EXECUTION__DEFAULT_PARALLELISM
              value: "8"
            - name: SAIL_KUBERNETES__IMAGE
              value: sail:0.7.3
            - name: SAIL_KUBERNETES__NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAIL_KUBERNETES__DRIVER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SAIL_KUBERNETES__WORKER_SERVICE_ACCOUNT_NAME
              value: sail
            - name: SAIL_CATALOG__LIST
              value: '[{type="iceberg-rest", name="lake", uri="http://lakekeeper.catalog:8181/catalog", warehouse="lake"}]'
            - name: SAIL_CATALOG__DEFAULT_CATALOG
              value: lake
            - name: SAIL_KUBERNETES__WORKER_POD_TEMPLATE
              value: |
                {"spec": {"nodeSelector": {"tier": "large"},
                  "containers": [{"name": "worker",
                    "envFrom": [{"secretRef": {"name": "s3-creds"}}],
                    "resources": {"requests": {"cpu": "250m", "memory": "256Mi"}, "limits": {"memory": "1Gi"}}}]}}
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sail
  namespace: compute
spec:
  selector:
    app: sail
  ports:
    - port: 50051
