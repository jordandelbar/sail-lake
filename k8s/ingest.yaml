apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetcher
  namespace: ingest
spec:
  selector:
    matchLabels:
      app: fetcher
  template:
    metadata:
      labels:
        app: fetcher
    spec:
      nodeSelector:
        tier: medium
      initContainers:
        - name: wait-for-nats
          image: curlimages/curl:8.17.0
          command:
            - sh
            - -c
            - until curl -sf http://nats:8222/healthz >/dev/null; do sleep 1; done
      containers:
        - name: fetcher
          image: fetcher:dev
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-sink
  namespace: ingest
spec:
  selector:
    matchLabels:
      app: s3-sink
  template:
    metadata:
      labels:
        app: s3-sink
    spec:
      nodeSelector:
        tier: medium
      initContainers:
        - name: wait-for-stream
          image: curlimages/curl:8.17.0
          command:
            - sh
            - -c
            - until curl -sf 'http://nats:8222/jsz?streams=true' | grep -q '"QUAKES"'; do sleep 2; done
      containers:
        - name: connect
          image: docker.redpanda.com/redpandadata/connect:4
          args:
            - run
            - /app/connect.yaml
          envFrom:
            - secretRef:
                name: s3-creds
          env:
            - name: FLUSH_PERIOD
              value: 1m
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: app
          configMap:
            name: s3-sink
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: ingest
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      nodeSelector:
        tier: small
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: nats
          image: nats:2.11-alpine
          args:
            - -js
            - -sd
            - /data
            - -m
            - "8222"
          ports:
            - containerPort: 4222
            - containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        - name: data
          hostPath:
            path: /data/nats
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: ingest
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
