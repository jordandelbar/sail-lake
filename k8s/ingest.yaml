# Ingest: fetcher (USGS -> NATS) and sink (NATS -> S3) on the medium node, NATS on the small node.
# Fetcher is a baked image (ingest/fetcher), sink config via: just configmaps
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetcher
  namespace: ingest
spec:
  selector:
    matchLabels:
      app: fetcher
  template:
    metadata:
      labels:
        app: fetcher
    spec:
      nodeSelector:
        tier: medium
      containers:
        - name: fetcher
          image: fetcher:dev
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-sink
  namespace: ingest
spec:
  selector:
    matchLabels:
      app: s3-sink
  template:
    metadata:
      labels:
        app: s3-sink
    spec:
      nodeSelector:
        tier: medium
      containers:
        - name: connect
          image: docker.redpanda.com/redpandadata/connect:4
          args:
            - run
            - /app/connect.yaml
          envFrom:
            - secretRef:
                name: s3-creds
          env:
            - name: FLUSH_PERIOD
              value: 1m
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: app
          configMap:
            name: s3-sink
---
# NATS JetStream on the small node; only the ingest pods use it.
# ponytail: emptyDir JetStream storage, a NATS restart drops unflushed msgs. PVC if that matters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: ingest
spec:
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      nodeSelector:
        tier: small
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: nats
          image: nats:2.11-alpine
          args:
            - -js
            - -sd
            - /data
            - -m
            - "8222"
          ports:
            - containerPort: 4222
            - containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: ingest
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
