apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: storage
spec:
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      nodeSelector:
        tier: small
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: versitygw
          image: versity/versitygw:latest
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: AWS_ACCESS_KEY_ID
            - name: ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: AWS_SECRET_ACCESS_KEY
          args:
            - --port
            - ":7070"
            - posix
            - /data
          ports:
            - containerPort: 7070
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          hostPath:
            path: /data/s3
            type: Directory
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: storage
spec:
  selector:
    app: s3
  ports:
    - port: 7070
