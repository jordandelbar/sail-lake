apiVersion: batch/v1
kind: Job
metadata:
  name: quakes-backfill
  namespace: ingest
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        tier: medium
      initContainers:
        - name: wait-for-nats
          image: curlimages/curl:8.17.0
          command:
            - sh
            - -c
            - i=0; until curl -sf --max-time 5 http://nats:8222/healthz >/dev/null; do i=$((i+1)); [ $i -lt 150 ] || { echo "gave up waiting for NATS after 5 min"; exit 1; }; sleep 2; done
      containers:
        - name: backfill
          image: fetcher:dev
          env:
            - name: BACKFILL_DAYS
              value: "365"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
