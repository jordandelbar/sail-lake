# Infra on the small node: NATS (JetStream) + versitygw (S3 over ./data/s3).
# ponytail: emptyDir JetStream storage, a NATS restart drops unflushed msgs. PVC if that matters.
apiVersion: v1
kind: Secret
metadata: {name: s3-creds}
stringData:
  AWS_ACCESS_KEY_ID: admin
  AWS_SECRET_ACCESS_KEY: adminsecret
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://s3:7070
  AWS_ALLOW_HTTP: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nats}
spec:
  selector: {matchLabels: {app: nats}}
  template:
    metadata: {labels: {app: nats}}
    spec:
      nodeSelector: {tier: small}
      tolerations: [{key: node-role.kubernetes.io/control-plane, effect: NoSchedule}]
      containers:
        - name: nats
          image: nats:2.11-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports: [{containerPort: 4222}, {containerPort: 8222}]
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: nats}
spec:
  selector: {app: nats}
  ports: [{name: client, port: 4222}, {name: monitor, port: 8222}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s3}
spec:
  selector: {matchLabels: {app: s3}}
  template:
    metadata: {labels: {app: s3}}
    spec:
      nodeSelector: {tier: small}
      tolerations: [{key: node-role.kubernetes.io/control-plane, effect: NoSchedule}]
      containers:
        - name: versitygw
          image: versity/versitygw:latest
          env:
            - {name: ROOT_ACCESS_KEY, valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_ACCESS_KEY_ID}}}
            - {name: ROOT_SECRET_KEY, valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_SECRET_ACCESS_KEY}}}
          args: ["--port", ":7070", "posix", "/data"]
          ports: [{containerPort: 7070}]
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
      volumes: [{name: data, hostPath: {path: /data/s3, type: Directory}}]
---
apiVersion: v1
kind: Service
metadata: {name: s3}
spec:
  selector: {app: s3}
  ports: [{port: 7070}]
