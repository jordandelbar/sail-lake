kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: minilake
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: ./data
        containerPath: /data
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            - name: system-reserved
              value: cpu=14,memory=28562Mi
            - name: node-labels
              value: tier=small
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            - name: system-reserved
              value: cpu=14,memory=28562Mi
            - name: node-labels
              value: tier=medium
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            - name: system-reserved
              value: cpu=14,memory=29074Mi
            - name: node-labels
              value: tier=large
